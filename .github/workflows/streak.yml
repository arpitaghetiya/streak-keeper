name: Exam Streak Keeper

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make daily contribution
        run: |
          echo "Exam day - $(date -u)" >> streak.txt
          git config user.name "arpitaghetiya"          
          git config user.email "251578312+arpitaghetiya@users.noreply.github.com"
          git add streak.txt
          git commit -m "Daily exam streak"
          git push
